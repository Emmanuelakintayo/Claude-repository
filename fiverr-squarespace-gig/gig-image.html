<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:769px;overflow:hidden;font-family:'Helvetica Neue',Arial,sans-serif;background:#0b0b12;position:relative;color:#fff}
.glow1{position:absolute;width:700px;height:700px;right:-120px;top:-180px;background:radial-gradient(circle,#7c5cff88,transparent 65%)}
.glow2{position:absolute;width:600px;height:600px;left:-200px;bottom:-260px;background:radial-gradient(circle,#00e0b055,transparent 65%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:48px 48px}
.left{position:absolute;left:70px;top:90px;width:600px}
.tag{display:inline-block;padding:10px 20px;border:2px solid #00e0b0;color:#00e0b0;border-radius:40px;font-weight:700;letter-spacing:3px;font-size:19px}
h1{font-family:Georgia,'Times New Roman',serif;font-size:96px;line-height:.98;margin-top:34px;font-weight:700;letter-spacing:-2px}
h1 em{font-style:italic;background:linear-gradient(90deg,#a68bff,#00e0b0);-webkit-background-clip:text;color:transparent}
.sub{font-size:30px;margin-top:30px;color:#d7d7e6;line-height:1.35}
.chips{margin-top:38px;display:flex;gap:10px;white-space:nowrap}
.chip{background:#ffffff14;border:1px solid #ffffff30;padding:11px 15px;border-radius:12px;font-size:20px;font-weight:600}
.chip b{color:#00e0b0;margin-right:8px}
.browser{position:absolute;left:720px;top:110px;width:500px;height:430px;background:#fff;border-radius:18px;box-shadow:0 40px 90px #000a,0 0 0 1px #ffffff30;transform:rotate(3deg);overflow:hidden}
.bar{height:38px;background:#ececf3;display:flex;align-items:center;padding:0 14px;gap:7px}
.bar i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.bar i:nth-child(2){background:#febc2e}.bar i:nth-child(3){background:#28c840}
.url{margin-left:14px;flex:1;height:20px;background:#fff;border-radius:10px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:16px 26px;color:#111}
.nav .logo{width:70px;height:14px;background:#111;border-radius:3px}.nav .m{display:flex;gap:14px}.nav .m span{width:36px;height:8px;background:#bbb;border-radius:4px}
.hero{margin:6px 22px;height:190px;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#00e0b0);padding:28px;position:relative}
.hero .l1{width:240px;height:22px;background:#fff;border-radius:6px}.hero .l2{width:170px;height:22px;background:#fff;border-radius:6px;margin-top:10px}
.hero .btn{width:110px;height:34px;background:#0b0b12;border-radius:20px;margin-top:22px}
.hero .blob{position:absolute;right:26px;bottom:-30px;width:150px;height:170px;border-radius:80px 80px 0 0;background:#ffffff55}
.cards{display:flex;gap:14px;padding:18px 22px}.cards div{flex:1;height:100px;border-radius:12px;background:#f0eefc}.cards div:nth-child(2){background:#e1faf3}
.phone{position:absolute;left:1010px;top:330px;width:190px;height:380px;background:#111;border-radius:34px;border:6px solid #2c2c3a;box-shadow:0 30px 70px #000b;transform:rotate(-6deg);overflow:hidden}
.phone .h{margin:18px 12px 8px;height:120px;border-radius:14px;background:linear-gradient(135deg,#ff7ab6,#7c5cff)}
.phone .r{margin:10px 12px;height:16px;background:#ffffff30;border-radius:5px}
.phone .p{display:flex;gap:8px;margin:12px}.phone .p div{flex:1;height:80px;border-radius:10px;background:#ffffff22}
.badge{white-space:nowrap;position:absolute;background:#fff;color:#111;font-weight:800;padding:14px 22px;border-radius:16px;font-size:23px;box-shadow:0 18px 40px #0008;display:flex;align-items:center;gap:10px}
.badge s{text-decoration:none;display:inline-block;width:30px;height:30px;border-radius:50%;background:#00c896;color:#fff;text-align:center;line-height:30px;font-size:19px}
.b1{left:690px;top:520px;transform:rotate(-4deg)}.b2{left:900px;top:56px;transform:rotate(5deg)}
.foot{position:absolute;left:70px;bottom:46px;font-size:24px;color:#bfbfd4;letter-spacing:1px}
.foot b{color:#fff}
</style></head><body>
<div class="glow1"></div><div class="glow2"></div><div class="grid"></div>
<div class="left">
<span class="tag">SQUARESPACE EXPERT</span>
<h1>Your site,<br><em>built to sell.</em></h1>
<div class="sub">Custom Squarespace design, redesign &amp; stores that win clients.</div>
<div class="chips"><span class="chip"><b>✓</b>SEO Ready</span><span class="chip"><b>✓</b>Mobile Perfect</span><span class="chip"><b>✓</b>Online Store</span></div>
</div>
<div class="browser"><div class="bar"><i></i><i></i><i></i><div class="url"></div></div>
<div class="nav"><div class="logo"></div><div class="m"><span></span><span></span><span></span></div></div>
<div class="hero"><div class="l1"></div><div class="l2"></div><div class="btn"></div><div class="blob"></div></div>
<div class="cards"><div></div><div></div><div></div></div></div>
<div class="phone"><div class="h"></div><div class="r"></div><div class="r" style="width:60%"></div><div class="p"><div></div><div></div></div></div>
<div class="badge b2"><s>★</s>Premium Design</div>
<div class="badge b1"><s>✓</s>Launch-Ready in Days</div>
<div class="foot"><b>Redesign</b> · <b>New Build</b> · <b>eCommerce</b> · <b>SEO</b></div>
</body></html>
